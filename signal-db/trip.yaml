module_group: trip
description: "Trip computer messages for Peugeot 407 CAN2004 comfort bus"

messages:
  Msg221:
    can_id: 0x221
    period_ms: 1000
    required_modules: ['bsi-trip']
    description: |
      Trip computer: instantaneous fuel consumption, autonomy, distance, stalk buttons.
    encode_body: |
      t = car.trip
      com_r = 1 if (t.com_right or getattr(t, '_com_right_ticks', 0) > 0) else 0
      com_l = 1 if (t.com_left or getattr(t, '_com_left_ticks', 0) > 0) else 0
      if hasattr(t, 'step_com_pulses'):
          t.step_com_pulses()
      b0 = (t.hide_fuel << 7) | (t.hide_dist << 6) | (com_r << 3) | com_l
      fuel = int(t.fuel * 10)
      autonomy = int(t.autonomy)
      distance = int(t.dist * 10)
      return [b0, fuel >> 8, fuel & 0xFF,
              autonomy >> 8, autonomy & 0xFF,
              distance >> 8, distance & 0xFF]
    decode_body: |
      if len(data) < 7:
          return
      t = car.trip
      t.hide_fuel = (data[0] >> 7) & 1
      t.hide_dist = (data[0] >> 6) & 1
      t.com_right = (data[0] >> 3) & 1
      t.com_left = data[0] & 1
      t.fuel = ((data[1] << 8) | data[2]) / 10.0
      t.autonomy = (data[3] << 8) | data[4]
      t.dist = ((data[5] << 8) | data[6]) / 10.0

  Msg2A1:
    can_id: 0x2A1
    period_ms: 1000
    required_modules: ['bsi-trip']
    description: |
      Trip computer historical record 1 (MSG_INFOS_TRAJET1_ODB).
      Byte 0 = mean speed (uint8 km/h), Bytes 1-2 = distance, Bytes 3-4 = avg consumption, Bytes 5-6 = avg speed (uint16).
    encode_body: |
      hist = car.trip.hist[0]
      dist = int(hist['dist'])
      fuel = int(hist['fuel'] * 10)
      speed = int(hist['speed'])
      return [speed & 0xFF, dist >> 8, dist & 0xFF,
              fuel >> 8, fuel & 0xFF,
              speed >> 8, speed & 0xFF]
    decode_body: |
      if len(data) >= 5:
          h = car.trip.hist[0]
          h['dist'] = (data[1] << 8) | data[2]
          h['fuel'] = ((data[3] << 8) | data[4]) / 10.0
          h['speed'] = (data[5] << 8) | data[6] if len(data) >= 7 and (data[5] or data[6]) else data[0]

  Msg261:
    can_id: 0x261
    period_ms: 1000
    required_modules: ['bsi-trip']
    description: |
      Trip computer historical record 2 (MSG_INFOS_TRAJET2_ODB).
      Byte 0 = mean speed (uint8 km/h), Bytes 1-2 = distance, Bytes 3-4 = avg consumption, Bytes 5-6 = avg speed (uint16).
    encode_body: |
      hist = car.trip.hist[1]
      dist = int(hist['dist'])
      fuel = int(hist['fuel'] * 10)
      speed = int(hist['speed'])
      return [speed & 0xFF, dist >> 8, dist & 0xFF,
              fuel >> 8, fuel & 0xFF,
              speed >> 8, speed & 0xFF]
    decode_body: |
      if len(data) >= 7:
          h = car.trip.hist[1]
          h['dist'] = (data[1] << 8) | data[2]
          h['fuel'] = ((data[3] << 8) | data[4]) / 10.0
          h['speed'] = (data[5] << 8) | data[6] if len(data) >= 7 and (data[5] or data[6]) else data[0]
